{% extends 'base.html' %}{% block content %}<div class="pagehead"><div class="eyebrow">APPLICATION FORM / 01</div><h1>팩션 지원서</h1><p>정확한 정보를 입력해 주세요. 모든 항목은 필수입니다.</p></div><form class="panel form" method="post" action="/apply"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>인게임 닉네임<input name="rp_name" maxlength="80" required value="{{ data.get('rp_name','') }}" placeholder="캐릭터 닉네임"></label><label>디스코드 아이디<input name="discord" maxlength="100" required value="{{ data.get('discord','') }}" placeholder="예: username 또는 username#0000"></label><div class="two"><label>나이<input name="age" maxlength="20" required value="{{ data.get('age','') }}" placeholder="예: 20세"></label><label>주 플레이 가능 시간<input name="playtime" maxlength="100" required value="{{ data.get('playtime','') }}" placeholder="예: 평일 20~24시"></label></div><label>RP / FiveM 경력<textarea name="experience" rows="4" required placeholder="서버 경험, 이전 소속 및 활동 이력">{{ data.get('experience','') }}</textarea></label><label>지원 동기<textarea name="motivation" rows="5" required placeholder="지원하게 된 이유를 작성해 주세요.">{{ data.get('motivation','') }}</textarea></label><label>본인의 장점 및 각오<textarea name="strengths" rows="4" required placeholder="조직에 기여할 수 있는 점을 작성해 주세요.">{{ data.get('strengths','') }}</textarea></label><input class="hp" name="website" tabindex="-1" autocomplete="off"><p class="privacy">제출한 정보는 팩션 지원 심사 목적으로만 사용됩니다.</p><button class="btn full" type="submit">지원서 제출하기 <b>→</b></button></form>{% endblock %}
